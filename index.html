<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pausa Caffè - Chat Anonima</title>
    <meta name="theme-color" content="#120D0A">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Libreria Socket.io per connessione al server -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        :root {
            --bg-primary: #120D0A;
            --bg-secondary: #1A130E;
            --bg-card: #241C15;
            --bg-hover: #2E241C;
            --accent-primary: #D97706;
            --accent-hover: #B45309;
            --accent-light: #F59E0B;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --border-color: #362A20;
            --msg-sent: #D97706;
            --msg-received: #2A2119;
            --online-green: #10B981;
            --danger-red: #EF4444;
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Light Theme Variable Overrides */
        body.light-theme {
            --bg-primary: #F3F4F6;
            --bg-secondary: #FFFFFF;
            --bg-card: #F9FAFB;
            --bg-hover: #E5E7EB;
            --accent-primary: #D97706;
            --accent-hover: #B45309;
            --accent-light: #D97706;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --msg-sent: #D97706;
            --msg-received: #F3F4F6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100dvh;
            width: 100%;
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            height: 100dvh;
            background-color: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s ease;
        }

        @media (min-width: 600px) {
            .app-container {
                height: 92dvh;
                border-radius: var(--radius-lg);
                border: 1px solid var(--border-color);
            }
        }

        /* Header Bar */
        .app-header {
            padding: 16px 20px;
            background-color: var(--bg-secondary);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #D97706, #78350F);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        }

        .brand-text h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .brand-text p {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--online-green);
            display: inline-block;
            box-shadow: 0 0 8px var(--online-green);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            background: var(--bg-hover);
            border-color: var(--accent-primary);
        }

        /* Screens */
        .screen {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .screen.active {
            display: flex;
        }

        /* Lobby */
        .lobby-content {
            flex: 1;
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 24px;
            overflow-y: auto;
        }

        .coffee-animation {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--accent-primary);
            opacity: 0;
            animation: pulse 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .pulse-ring:nth-child(2) {
            animation-delay: 0.8s;
        }

        @keyframes pulse {
            0% { transform: scale(0.6); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .cup-container {
            width: 90px;
            height: 90px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            z-index: 2;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .lobby-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .lobby-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            max-width: 320px;
            line-height: 1.5;
        }

        .features-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 340px;
            margin: 10px 0;
        }
